name: Lint and build Jotting

on:
  push:
    branches: [master]
    paths: &app-paths
      - 'Jotting/**'
      - 'Jotting.xcodeproj/**'
      - 'Info.plist'
      - '.swiftlint.yml'
      - '.github/workflows/build.yaml'
  pull_request:
    branches: [master]
    paths: *app-paths

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint 0.65.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d swiftlint-bin
          echo "$RUNNER_TEMP/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swiftlint lint --strict --no-cache --reporter github-actions-logging Jotting

      - name: Build
        run: xcodebuild -project Jotting.xcodeproj -scheme Jotting -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
